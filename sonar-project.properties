# Configuration SonarCloud — TP Analyse de code
# Remplacer les valeurs entre <...> par vos identifiants SonarCloud

sonar.projectKey=<VOTRE_PROJECT_KEY>
sonar.organization=<VOTRE_ORGANISATION>

sonar.host.url=https://sonarcloud.io

# Sources : tout le dépôt (Java, Kotlin, XML, HTML, CSS)
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions (build, binaires, assets volumineux)
sonar.exclusions=**/build/**,**/.gradle/**,**/gradle/**,**/*.png,**/*.jpg,**/*.webp,**/*.jar,**/*.apk,**/*.dex,**/*.class

# Java : chemins des .class après compilation (relancer après gradlew assembleDebug)
sonar.java.binaries=**/build/intermediates/javac/**/classes,**/build/tmp/kotlin-classes/**

# Kotlin
sonar.kotlin.detection.reportPaths=**/build/reports/detekt/*.xml

# Tests (optionnel)
sonar.tests=app/src/test,app/src/androidTest
sonar.test.inclusions=**/*Test*.java,**/*Test*.kt
